<svg width="460" height="195" viewBox="0 0 460 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: #38bdf8; }
    .lang-name { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
    .lang-pct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .border { stroke: #30363d; stroke-width: 1; }
  </style>
  <rect width="460" height="195" rx="10" fill="#0d1117" class="border"/>
  
  <text x="28" y="36" class="header">My Programming Languages</text>
  
  <!-- Multi-segment Progress Bar (Total width 404px) -->
  <g transform="translate(28, 56)">
    <rect x="0" y="0" width="404" height="10" rx="5" fill="#21262d"/>
    <!-- TypeScript 67.5% -> 272.7px -->
    <rect x="0" y="0" width="273" height="10" rx="5" fill="#3178c6"/>
    <!-- JavaScript 24.8% -> 100.2px -->
    <rect x="273" y="0" width="100" height="10" fill="#f7df1e"/>
    <!-- C# 2.6% -> 10.5px -->
    <rect x="373" y="0" width="11" height="10" fill="#239120"/>
    <!-- HTML 2.4% -> 9.7px -->
    <rect x="384" y="0" width="10" height="10" fill="#e34c26"/>
    <!-- CSS 1.2% -> 4.8px -->
    <rect x="394" y="0" width="5" height="10" fill="#563d7c"/>
    <!-- Python 0.8% -> 5px (with rounded end) -->
    <rect x="399" y="0" width="5" height="10" rx="2.5" fill="#3572A5"/>
  </g>
  
  <!-- Legend Grid -->
  <g transform="translate(28, 92)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3178c6"/>
      <text x="20" y="10" class="lang-name">TypeScript <tspan class="lang-pct">67.5%</tspan></text>
      
      <circle cx="6" cy="34" r="5" fill="#239120"/>
      <text x="20" y="38" class="lang-name">C# <tspan class="lang-pct">2.6%</tspan></text>
      
      <circle cx="6" cy="62" r="5" fill="#563d7c"/>
      <text x="20" y="66" class="lang-name">CSS <tspan class="lang-pct">1.2%</tspan></text>
    </g>
    
    <!-- Column 2 -->
    <g transform="translate(210, 0)">
      <circle cx="6" cy="6" r="5" fill="#f7df1e"/>
      <text x="20" y="10" class="lang-name">JavaScript <tspan class="lang-pct">24.8%</tspan></text>
      
      <circle cx="6" cy="34" r="5" fill="#e34c26"/>
      <text x="20" y="38" class="lang-name">HTML <tspan class="lang-pct">2.4%</tspan></text>
      
      <circle cx="6" cy="62" r="5" fill="#3572A5"/>
      <text x="20" y="66" class="lang-name">Python <tspan class="lang-pct">0.8%</tspan></text>
    </g>
  </g>
</svg>